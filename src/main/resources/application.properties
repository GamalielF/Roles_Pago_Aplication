spring.application.name=roles-pago-backend
spring.datasource.url=jdbc:mysql://localhost:3306/roles_pago?
useSSL=false&serverTimezone=America/Guayaquil
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.security.mock-enabled=true
app.bootstrap.admin-username=fsepa
# Carpeta raiz donde se guardan los PDFs (se crea sola si no existe)
app.storage.roles-pago.base-path=C:/RolesPago
# Tamano maximo por PDF (5 MB)
app.storage.roles-pago.max-file-bytes=5242880

# Limites de Spring para subidas multipart (por defecto son de solo 1 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=300MB
